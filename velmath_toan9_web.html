<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VelMath - Toán 9</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d1c;color:#f8fafc;font-family:Segoe UI,Arial,sans-serif}body:before{content:"";position:fixed;width:500px;height:500px;border-radius:50%;background:#2563eb;filter:blur(120px);opacity:.15;top:-180px;left:-150px;z-index:-1}.app{max-width:1100px;margin:auto;padding:18px;min-height:100vh}.top,.screen{background:#111a2eee;border:1px solid #263653;border-radius:24px}.top{padding:16px 22px;display:flex;align-items:center;gap:15px}.logo{font-size:25px;font-weight:900;margin-right:auto}.badge{padding:9px 14px;border-radius:20px;color:#07111f;font-weight:900}button{border:0;border-radius:14px;padding:13px 18px;font-weight:800;font-size:15px;cursor:pointer;transition:.18s}button:hover{transform:translateY(-2px);filter:brightness(1.08)}.menu{background:#273449;color:#fff}.primary{background:#38bdf8;color:#07111f}.screen{margin-top:18px;padding:32px}.hero{text-align:center}.hero h1{font-size:40px;margin:8px}.hero h2{color:#38bdf8}.muted{color:#94a3b8}.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:25px auto;max-width:850px}.stage{min-height:145px;color:#07111f}.locked{background:#263449!important;color:#94a3b8!important;cursor:not-allowed}.stats{display:flex;justify-content:space-between;font-weight:900;margin:15px 0;color:#facc15}.progress{height:9px;background:#1e293b;border-radius:20px;overflow:hidden}.bar{height:100%;width:100%;background:#22c55e;transition:.4s}.card{background:#17233d;border-radius:20px;padding:30px;text-align:center;margin-top:20px}.question{font-size:28px;font-weight:900;min-height:90px;display:flex;align-items:center;justify-content:center}.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:800px;margin:auto}.answer{background:#1d2c4a;color:#fff;min-height:62px}.correct{background:#16a34a!important}.wrong{background:#dc2626!important}.msg{min-height:30px;margin:15px;font-size:18px;font-weight:900}.pulse{animation:pulse .3s}.shake{animation:shake .35s}@keyframes pulse{50%{transform:scale(1.03);box-shadow:0 0 30px #22c55e66}}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}@media(max-width:700px){.stages,.answers{grid-template-columns:1fr}.top{flex-wrap:wrap}.question{font-size:21px}.hero h1{font-size:30px}}
</style></head><body><div class="app"><div class="top"><div class="logo">🧠 VelMath</div><div id="badge" class="badge">🗺️ CHỌN MÀN</div><button class="menu" onclick="menu()">☰ MENU</button></div><main id="app"></main></div>
<script>
const Q=[["Giải phương trình: 2x + 5 = 15",["3","5","7","10"],"5"],["Giải phương trình: 3x - 6 = 12",["4","6","8","10"],"6"],["Tính √81",["7","8","9","10"],"9"],["Tính √49 + √16",["9","10","11","12"],"11"],["Nếu y = 2x + 1 và x = 3 thì y bằng bao nhiêu?",["5","6","7","8"],"7"],["Nghiệm của x² = 25 là:",["x = 5","x = -5","x = ±5","x = 25"],"x = ±5"],["Một tam giác vuông có hai cạnh góc vuông 3 và 4. Cạnh huyền bằng:",["5","6","7","8"],"5"],["Tính: (x + 2)(x - 2)",["x² + 4","x² - 4","x² + 2","x² - 2"],"x² - 4"],["Nếu sin A = 1/2 và A là góc nhọn thì A bằng:",["30°","45°","60°","90°"],"30°"],["Giải: x² - 9 = 0",["x = 3","x = -3","x = ±3","x = 9"],"x = ±3"],["Hệ số góc của đường thẳng y = 3x - 2 là:",["-2","2","3","-3"],"3"],["Tính √100 - √36",["2","4","6","8"],"4"],["Phương trình x² - 5x + 6 = 0 có nghiệm:",["1 và 6","2 và 3","-2 và -3","3 và 4"],"2 và 3"],["Nếu a = 3, b = 4 thì a² + b² bằng:",["7","12","25","49"],"25"],["Diện tích hình tròn bán kính 3 cm, lấy π ≈ 3,14:",["18,84","28,26","9,42","37,68"],"28,26"]],S=[{n:1,name:"KHỞI ĐỘNG",time:90,points:5,count:5,color:"#22c55e"},{n:2,name:"TĂNG TỐC",time:75,points:8,count:7,color:"#38bdf8"},{n:3,name:"BỨT PHÁ",time:60,points:10,count:8,color:"#a78bfa"},{n:4,name:"THỬ THÁCH",time:50,points:12,count:10,color:"#f97316"},{n:5,name:"CHUNG KẾT",time:40,points:20,count:15,color:"#ef4444"}];let unlocked=+localStorage.getItem("velmath_unlocked")||1,sel=1,qs=[],i=0,score=0,correct=0,wrong=0,time=0,timer=null,running=false;
const st=()=>S[sel-1],save=()=>localStorage.setItem("velmath_unlocked",unlocked);
function menu(){clearInterval(timer);running=false;document.getElementById("badge").textContent="🗺️ CHỌN MÀN";app.innerHTML='<section class="screen hero"><div style="font-size:60px">🗺️</div><h1>HÀNH TRÌNH TOÁN 9</h1><h2>THỬ THÁCH NHIỀU MÀN</h2><p class="muted">🔓 Đã mở khóa: Màn '+unlocked+'/'+S.length+'</p><div class="stages">'+S.map(x=>{let l=x.n>unlocked;return '<button class="stage '+(l?'locked':'')+'" style="'+(l?'':'background:'+x.color)+'" '+(l?'disabled':'')+' onclick="start('+x.n+')">'+(l?'🔒':x.n===5?'🏆':x.n)+'<br>MÀN '+x.n+'<br>'+x.name+'<br><small>'+x.count+' câu • '+x.time+'s</small></button>'}).join('')+'</div><p class="muted">💡 Đạt ít nhất 50% để mở màn tiếp theo.</p><button class="menu" onclick="reset()">🗑️ XÓA TIẾN TRÌNH</button></section>'}
function reset(){if(confirm("Xóa tiến trình và khóa lại từ Màn 1?")){unlocked=1;save();menu()}}
function start(n){sel=n;let x=st();qs=[...Q].sort(()=>Math.random()-.5).slice(0,Math.min(x.count,Q.length));i=0;score=correct=wrong=0;time=x.time;running=true;document.getElementById("badge").textContent='🎮 MÀN '+x.n+': '+x.name;document.getElementById("badge").style.background=x.color;render();question();clock()}
function render(){app.innerHTML='<section class="screen"><div class="stats"><span id="sc">⭐ 0 điểm</span><span id="ct">📚 Câu 1/'+qs.length+'</span><span id="tm">⏱️ '+time+'s</span></div><div class="progress"><div id="bar" class="bar"></div></div><div id="card" class="card"><div id="q" class="question"></div><div id="ans" class="answers"></div><div id="msg" class="msg"></div><button class="menu" onclick="menu()">☰ Về menu</button></div></section>'}
function question(){if(!running)return;let q=qs[i];qEl=document.getElementById("q");qEl.textContent=q[0];document.getElementById("ct").textContent='📚 Câu '+(i+1)+'/'+qs.length;document.getElementById("msg").textContent="";document.getElementById("ans").innerHTML=q[1].map((a,j)=>'<button class="answer" onclick="answer('+j+')">'+String.fromCharCode(65+j)+'. '+a+'</button>').join('')}
function answer(j){if(!running)return;let q=qs[i],bs=[...document.querySelectorAll(".answer")];bs.forEach(b=>b.disabled=true);let card=document.getElementById("card");if(q[1][j]===q[2]){score+=st().points;correct++;bs[j].classList.add("correct");msg.innerHTML='✨ CHÍNH XÁC! +'+st().points+' điểm ✨';msg.style.color="#22c55e";card.classList.add("pulse")}else{wrong++;bs[j].classList.add("wrong");let r=q[1].indexOf(q[2]);if(r>=0)bs[r].classList.add("correct");msg.innerHTML='❌ CHƯA ĐÚNG! Đáp án: '+q[2];msg.style.color="#ef4444";card.classList.add("shake")}sc.textContent='⭐ '+score+' điểm';setTimeout(()=>{card.classList.remove("pulse","shake");i++;i<qs.length?question():end()},700)}
function clock(){clearInterval(timer);timer=setInterval(()=>{if(!running)return;time--;update();if(time<=0)end()},1000);update()}
function update(){tm.textContent='⏱️ '+time+'s';let r=Math.max(0,time/st().time);bar.style.width=r*100+'%';bar.style.background=r>.5?'#22c55e':r>.25?'#facc15':'#ef4444'}
function end(){if(!running)return;running=false;clearInterval(timer);let p=Math.round(correct/qs.length*100);if(p>=50&&sel<S.length){unlocked=Math.max(unlocked,sel+1);save()}let res=p>=80?'🏆 XUẤT SẮC!':p>=60?'👏 RẤT TỐT!':p>=50?'👍 ĐÃ VƯỢT QUA!':'💪 HÃY THỬ LẠI!';app.innerHTML='<section class="screen hero"><div style="font-size:60px">'+(p>=50?'🎉':'💪')+'</div><h1>'+res+'</h1><div class="card" style="font-size:20px;line-height:1.8">🎮 Màn '+sel+': '+st().name+'<br>⭐ Điểm: <b>'+score+'</b><br>✅ Đúng: <b>'+correct+'/'+qs.length+'</b><br>❌ Sai: <b>'+wrong+'</b><br>📊 Tỷ lệ: <b>'+p+'%</b></div><p><button class="primary" onclick="start('+sel+')">🔄 Chơi lại</button> '+(sel<S.length&&unlocked>sel?'<button class="primary" onclick="start('+(sel+1)+')">➡️ Màn '+(sel+1)+'</button>':'')+' <button class="menu" onclick="menu()">🗺️ Chọn màn</button></p></section>'}
menu();
</script></body></html>
